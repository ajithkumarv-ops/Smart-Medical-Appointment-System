<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myangadi Attendance</title>
  <meta name="description" content="Myangadi Attendance — Smart office attendance management with face recognition" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Georgia:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>

  <!-- ===== WELCOME SPLASH ===== -->
  <div id="splash" class="splash" role="status" aria-live="polite">
    <div class="splash-inner">
      <div class="splash-brand">MYANGADI</div>
      <div class="splash-subtitle">Attendance System</div>
      <div class="splash-arc-wrap">
        <svg class="arc-svg" viewBox="0 0 80 80" aria-hidden="true">
          <circle class="arc-track" cx="40" cy="40" r="32"/>
          <circle class="arc-spin"  cx="40" cy="40" r="32"/>
        </svg>
      </div>
      <div class="splash-dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p class="splash-status" id="splash-status">Loading models…</p>
    </div>
  </div>

  <!-- ===== TOP NAV (admin only) ===== -->
  <nav id="app-nav" class="app-nav hidden" aria-label="Main navigation">
    <a href="#dashboard" class="nav-brand" aria-label="Go to dashboard">MYANGADI</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false">
      <span class="hamburger"></span>
    </button>
    <ul class="nav-links" id="nav-links" role="list">
      <li><a href="#dashboard"   class="nav-link" data-page="dashboard">Dashboard</a></li>
      <li><a href="#calendar"    class="nav-link" data-page="calendar">Calendar</a></li>
      <li><a href="#manual"      class="nav-link" data-page="manual">Manual Entry</a></li>
      <li><a href="#report"      class="nav-link" data-page="report">Report</a></li>
      <li><a href="#" id="nav-logout" class="nav-link nav-logout">Logout</a></li>
    </ul>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="app-main" class="app-main">
    <div id="page-container" class="page-container"></div>
  </main>

  <!-- ===== TOAST CONTAINER ===== -->
  <div id="toast-container" class="toast-container" aria-live="assertive" aria-atomic="false"></div>

  <!-- ===== CONFIRM MODAL ===== -->
  <div id="confirm-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-box">
      <h3 id="confirm-title" class="modal-title">Confirm Action</h3>
      <p id="confirm-message" class="modal-message"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn btn-outline">Cancel</button>
        <button id="confirm-ok"     class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- ===== CDN SCRIPTS ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <!-- ===== APP SCRIPTS (order matters — no bundler) ===== -->
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/salary.js"></script>
  <script src="js/faceApi.js"></script>
  <script src="js/pages/checkin.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/employee.js"></script>
  <script src="js/pages/calendar.js"></script>
  <script src="js/pages/manual.js"></script>
  <script src="js/pages/report.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
